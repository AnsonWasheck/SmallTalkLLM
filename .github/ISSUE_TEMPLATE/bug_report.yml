name: Bug report
description: Report a reproducible code, training, evaluation, or inference issue.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include private checkpoints, credentials, or personally identifying conversation data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, device backend, and GPU/CPU.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command and smallest useful example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
