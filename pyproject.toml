[project]
name = "smalltalk-ai"
version = "0.1.0"
description = "An open research project on tiny models for natural casual conversation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "smalltalk-ai contributors" }]
keywords = ["language-model", "small-language-model", "conversation", "research", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "tokenizers>=0.15", "safetensors>=0.4", "pyyaml>=6.0"]

[project.optional-dependencies]
data = ["datasets>=2.14"]
logging = ["wandb>=0.16"]
dev = ["pytest>=7", "ruff>=0.6"]
qwen = ["transformers>=5.0", "accelerate>=1.0", "huggingface_hub>=0.25"]

[tool.setuptools.packages.find]
include = ["smalltalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["artifacts", "models", "data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
