# Stage 3: teacher distillation on rejection-sampled winners (smalltalk-15m)
run_name: distill-15m
stage: distill
model_config: configs/model/smalltalk-15m.yaml
tokenizer: artifacts/tokenizer-6144
train_data: data/processed/distill_train.jsonl
val_data: data/processed/val.jsonl
output_dir: artifacts/runs
init_from: artifacts/runs/sft-15m/best

seq_len: 1024
batch_size: 32
grad_accum_steps: 1
max_steps: 2000

learning_rate: 1.0e-4
min_lr_ratio: 0.1
warmup_ratio: 0.05
lr_schedule: cosine
mask_non_assistant: true

eval_every: 200
eval_batches: 20
save_every: 1000
log_every: 25

device: auto
dtype: auto
seed: 1337
wandb: false
