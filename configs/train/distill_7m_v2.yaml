# Online token-distribution distillation.  The student config and tokenizer are
# deliberately pinned; only a same-tokenizer teacher is allowed here.
run_name: distill-7m-v2
stage: clm
model_config: configs/model/smalltalk-7m.yaml
tokenizer: artifacts/tokenizer-4096
train_data: data/teacher_v2/train.jsonl
val_data: data/teacher_v2/validation.jsonl
output_dir: artifacts/runs
seq_len: 1024
batch_size: 8
grad_accum_steps: 8
max_steps: 10000
learning_rate: 0.00025
min_lr_ratio: 0.1
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
grad_clip: 1.0
warmup_ratio: 0.03
lr_schedule: cosine
eval_every: 250
eval_batches: 40
save_every: 1000
log_every: 25
device: auto
dtype: auto
seed: 1337
mask_non_assistant: false
