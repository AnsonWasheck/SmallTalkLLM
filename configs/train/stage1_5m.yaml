# Stage 1: conversational causal-LM pretraining (smalltalk-5m)
run_name: stage1-5m
stage: clm
model_config: configs/model/smalltalk-5m.yaml
tokenizer: artifacts/tokenizer-4096
train_data: data/processed/train.jsonl
val_data: data/processed/val.jsonl
output_dir: artifacts/runs

seq_len: 1024
batch_size: 64
grad_accum_steps: 4
max_steps: 20000

learning_rate: 5.0e-4
min_lr_ratio: 0.1
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
grad_clip: 1.0
warmup_ratio: 0.03
lr_schedule: cosine

eval_every: 500
eval_batches: 20
save_every: 2000
log_every: 50
keep_last: 2

device: auto
dtype: auto
seed: 1337
wandb: false
